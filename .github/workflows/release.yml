name: Publish release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish MCP server image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Conatus MCP server
            org.opencontainers.image.description=MCP server for the self-hosted Conatus task manager
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  npm:
    name: Publish npm package
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # registry credential, so no npm token is stored in this repository. It
      # needs a newer npm than Node 22 ships with.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      # A release tagged v0.3.0 shipping package.json 0.2.0 would publish a
      # version nobody can correlate with the release notes or the image tag.
      - name: Check the tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_TAG#v}" != "$package_version" ]; then
            echo "Release $RELEASE_TAG does not match package.json $package_version" >&2
            exit 1
          fi

      # Prereleases go to the beta dist-tag so `npx conatus-mcp` keeps resolving
      # to the newest stable release.
      - name: Publish
        run: npm publish ${{ github.event.release.prerelease && '--tag beta' || '' }}
